# Configuration for `bun test`, which runs ONLY the five SQLite suites
# (__tests__/sqlite/*.bun.test.ts): they execute WatermelonDB's encoded SQL,
# migrations and query plans on bun's built-in SQLite, which jest cannot load.
#
# Run them with `bun run test:sqlite` (= `bun test ./__tests__/sqlite`). Every other suite runs under jest (`bun run test`), the one
# runner. There is no ignore list to keep in step any more: until 2.8 a
# 27-entry list here decided which suites bun skipped, and it was already
# stale (audit 2026-11-08 §7.3).

[test]
preload = ["./bun-preload.ts"]
# Vendored docs and old experiments, not our tests.
pathIgnorePatterns = ["references/**"]
