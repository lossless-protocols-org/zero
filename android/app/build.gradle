apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Load keystore properties from secure file (not committed to git)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * R8 shrinks and obfuscates release builds (2.8; Play Vitals flagged the
 * unobfuscated build, deadline Feb 2027). Keep rules for every native
 * library live in proguard-rules.pro; res/raw/keep.xml keeps the images JS
 * looks up by name. A compile proves nothing here: each release is checked
 * on a device (expenses, refunds, money in, backup export + restore,
 * Reports, Settings sheets, widgets, the 50-step stress). mapping.txt is
 * archived with the symbols (scripts/archive-symbols.sh) and uploaded to Play.
 */
def enableProguardInReleaseBuilds = true

/**
 * zero ships on Hermes only. The template's JavaScriptCore fallback pulled a
 * floating `jsc-android:2026004.+` that no build used (audit 2026-11-08 §6.3);
 * turning Hermes off is now a build error rather than an untested engine.
 */

/**
 * The QA build (audit 2026-11-08 §6.3): the release build — R8, bundled JS —
 * under its own application id, signed with the debug key and named
 * "zero QA" (src/qa/res), so it installs beside the store build and never
 * touches its data (its launcher shortcuts: src/qa/res/xml). iOS has the same
 * split (ZERO_BUNDLE_ID, "zero QA").
 * `./gradlew assembleQa`.
 */
def qaIdSuffix = ".qa"

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.anotherwhy.zero"
    defaultConfig {
        applicationId "com.anotherwhy.zero"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 24
        versionName "2.8.0"
    }

    // 16 KB page size support (required for Android 15+ / Play submissions):
    // native libraries must ship UNCOMPRESSED and page-aligned, which is what
    // useLegacyPackaging = false does. The previous `true` did the opposite of
    // what its comment claimed.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['ZERO_UPLOAD_STORE_FILE'])
                storePassword keystoreProperties['ZERO_UPLOAD_STORE_PASSWORD']
                keyAlias keystoreProperties['ZERO_UPLOAD_KEY_ALIAS']
                keyPassword keystoreProperties['ZERO_UPLOAD_KEY_PASSWORD']
            } else {
                // Fail loudly instead of silently emitting an unsigned release
                // that only gets rejected at upload time.
                logger.warn("keystore.properties missing — release builds will not be signed.")
            }
        }
    }
    sourceSets {
        // The fixtures the JS, Kotlin and Swift sides all read (contracts/README.md).
        test.resources.srcDirs += ["${rootDir}/../contracts"]
    }
    lint {
        // Android Lint gates CI (audit 2026-11-08 §6.3): a new error fails the
        // build. What it reported on 2026-11-09 is in lint-baseline.xml, to be
        // worked down; never add to it to pass a build.
        abortOnError true
        checkReleaseBuilds true
        baseline = file("lint-baseline.xml")
    }
    testOptions {
        // Robolectric inflates the real widget layouts and reads the real strings.
        unitTests.includeAndroidResources = true
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        qa {
            initWith release
            applicationIdSuffix qaIdSuffix
            versionNameSuffix "-qa"
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
        }
        release {
            // Signed only when the upload keystore is here. Without it (CI) the build is an
            // explicit unsigned release, app-release-unsigned.apk, used to check the merged
            // manifest (scripts/check-no-read.mjs --apk); it can never be uploaded by mistake.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (!hermesEnabled.toBoolean()) {
        throw new GradleException("zero ships on Hermes only: keep hermesEnabled=true in gradle.properties.")
    }
    implementation("com.facebook.react:hermes-android")

    // Local JVM tests for the widget's Kotlin (src/test): test classpath only,
    // nothing ships. org.json is the real library because android.jar's copy
    // is a stub that throws in local tests.
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20240303")
    // The framework-backed parts (RemoteViews binding, the store, the provider's
    // alarm, quick-add intents) on a simulated Android (audit 2026-11-08 §6, App. B).
    testImplementation("org.robolectric:robolectric:4.17")
}
