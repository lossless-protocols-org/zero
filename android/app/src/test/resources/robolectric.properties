# Robolectric runs the JVM tests on Android 14: its Android 15+ sandboxes need
# Java 21, and the build (and CI) runs on Java 17. Suites that need another
# level say so with @Config(sdk = [...]).
sdk=34
# The widget code needs no React Native: a plain Application, not MainApplication,
# whose onCreate loads React Native's native libraries (absent on the JVM).
application=android.app.Application
