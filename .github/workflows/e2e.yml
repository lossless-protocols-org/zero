name: E2E

# Maestro flows (__tests__/e2e) on an Android emulator against the QA build:
# the real release JS, R8 and native screens (audit 2026-11-08 §7.6). Weekly
# and on demand: an emulator run takes minutes, and the per-push gate (ci.yml)
# already covers the code; this covers the assembled app.

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  android:
    name: First run on an emulator (QA build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the QA app (x86_64 for the emulator)
        working-directory: android
        run: ./gradlew assembleQa -PreactNativeArchitectures=x86_64

      # Pinned, like every other tool in CI; bump on purpose.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" -o install-maestro.sh
          bash install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # KVM for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r android/app/build/outputs/apk/qa/app-qa.apk
            maestro test __tests__/e2e -e APP_ID=com.anotherwhy.zero.qa
