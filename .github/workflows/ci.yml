name: CI

# The release gate (docs/RELEASE_QA.md §1) on every push and pull request to
# main. Until 2.8 CI ran only typecheck and the no-read source check; lint,
# jest, the coverage ratchet, the SQLite suites and the Kotlin tests were a
# manual promise (audit 2026-11-08 §7.1).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS gate (types, lint, format, jest + coverage, SQLite suites, no-read, contrast)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Read from package.json `packageManager` so CI runs the bun that wrote bun.lock.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # typecheck · lint · format:check · jest --coverage --ci (incl. layers, dead exports,
      # widget strings, the no-read gate's own tests) · test:sqlite · check:no-read · contrast
      - name: Gate
        run: bun run check

  android-unit:
    name: Android unit tests and Lint (widget, quick add, Google Play billing; both flavours)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The React Native Gradle plugin and autolinking read node_modules.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The runner image does not carry the NDK zero pins (android/build.gradle ndkVersion); Gradle installs
      # it on first use, which needs the SDK licences accepted.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Kotlin unit tests (JVM + Robolectric)
        run: bun run test:android

      # New Lint errors fail; what existed on 2026-11-09 is in app/lint-baseline.xml (audit §6.3).
      - name: Android Lint
        working-directory: android
        run: ./gradlew :app:lintPlayDebug :app:lintFossDebug -q

  ios-shared:
    name: Swift code (widget reader, money format, queue, Siri matching, App Store billing)
    # ZeroShared uses iOS 26 APIs (SnippetIntent); Xcode 16 on macos-15 cannot build it.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode on the image
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      # The Swift tests read contracts/, the fixtures the JS and Kotlin tests read. The billing
      # tests run against Xcode's local test store: no network, no Apple account.
      - name: Swift tests
        run: sh scripts/test-ios.sh

  android-apk-privacy:
    name: Release APK holds only allowed permissions and code (${{ matrix.flavour }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Both builds, each against its own allow list (scripts/check-no-read.mjs): play may add Google
        # Play Billing's one permission and must not contain Google's usage uploader; foss must contain
        # no store code at all.
        include:
          - flavour: play
            task: assemblePlayRelease
          - flavour: foss
            task: assembleFossRelease
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The runner image does not carry the NDK zero pins (android/build.gradle ndkVersion); Gradle installs
      # it on first use, which needs the SDK licences accepted.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # R8 on, as shipped; unsigned here (no keystore secret in CI), which does not change
      # the merged manifest. One ABI keeps the native build short.
      - name: Build release APK
        working-directory: android
        run: ./gradlew ${{ matrix.task }} -PreactNativeArchitectures=arm64-v8a

      # The merged manifest Play sees and the classes the APK defines, including what transitive
      # Gradle libraries add, which the source check cannot see.
      - name: No-read gate on the APK
        run: node scripts/check-no-read.mjs --flavour ${{ matrix.flavour }} --apk android/app/build/outputs/apk/${{ matrix.flavour }}/release/app-${{ matrix.flavour }}-release-unsigned.apk
